name: Build CADCraft with ribbon

# Run it by hand: Actions tab > "Build CADCraft with ribbon" > Run workflow.
# Needs cadcraft-ribbon.patch in the root of this repository.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Tools the builder needs (Pillow and ImageMagick make the launcher icons)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil imagemagick librsvg2-bin libmagickcore-6.q16-6-extra
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Rust toolchain for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Check out CADCraft and apply the ribbon patch
        run: |
          mkdir -p source
          git clone https://github.com/storytold/cadcraft.git source/cadcraft
          git -C source/cadcraft checkout 41d9b5e957b0719c04b9687c4f29088d77153c31
          git -C source/cadcraft apply --check "$GITHUB_WORKSPACE/cadcraft-ribbon.patch"
          git -C source/cadcraft apply "$GITHUB_WORKSPACE/cadcraft-ribbon.patch"
          git -C source/cadcraft status --short

      - name: Kunci versi crate agar tidak diturunkan oleh build.sh
        # build.sh "memperbaiki" Cargo.toml dengan mengganti teks persis
        # harfrust = "0.14" dan rstar version = "0.13". Dengan pin "=" teks itu
        # tidak cocok lagi, jadi versi yang benar (yang dipakai kode) tetap dipakai.
        run: |
          cd source/cadcraft
          sed -i 's/harfrust = "0.14"/harfrust = "=0.14.0"/' Cargo.toml
          sed -i 's/rstar = { version = "0.13", default-features = false }/rstar = { version = "=0.13.0", default-features = false }/' crates/engine/Cargo.toml
          grep -n "harfrust" Cargo.toml
          grep -n "rstar" crates/engine/Cargo.toml
          grep -q '"=0.14.0"' Cargo.toml
          grep -q '"=0.13.0"' crates/engine/Cargo.toml

      - name: Sesuaikan svg_read.rs dengan quick-xml 0.41
        # build.sh menurunkan quick-xml 0.42 -> 0.41. Di 0.41 into_inner() sudah
        # mengembalikan &[u8], jadi .as_bytes() harus dihapus agar bisa dikompilasi.
        run: |
          f=source/cadcraft/crates/io/src/svg_read.rs
          sed -i 's/\.into_inner()\.as_bytes()/.into_inner()/g' "$f"
          grep -n "into_inner" "$f"

      - name: Shim cargo-ndk (tambah field Services di wrapper Android)
        # Wrapper apps/cadcraft-android dibuat otomatis oleh build.sh dan belum
        # mengisi field baru Services (no_file_system, pick_lisp). Shim ini
        # menambahkannya tepat sebelum cargo-ndk mengompilasi, lalu menjalankan
        # cargo-ndk yang asli.
        run: |
          cargo install cargo-ndk --locked
          mkdir -p "$RUNNER_TEMP/shim"
          cat > "$RUNNER_TEMP/shim/cargo-ndk" <<'EOF'
          #!/usr/bin/env bash
          f="$GITHUB_WORKSPACE/source/cadcraft/apps/cadcraft-android/src/lib.rs"
          if [ -f "$f" ] && ! grep -q 'no_file_system' "$f"; then
            sed -i 's/^\([[:space:]]*\)Services {$/\1Services {\n\1    no_file_system: false,\n\1    pick_lisp: None,/' "$f"
            echo "[shim] Services di $f diberi no_file_system dan pick_lisp"
            grep -n -A3 'Services {' "$f" | head -20
          fi
          exec "$HOME/.cargo/bin/cargo-ndk" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/shim/cargo-ndk"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"

      - name: Lihat bagian build.sh yang mengubah Cargo.toml
        run: grep -n "harfrust\|rstar\|quick-xml" build.sh || true

      - name: Diagnostics (versions the build will use)
        run: |
          rustc --version; cargo --version
          git -C source/cadcraft log -1 --oneline
          grep -n "harfrust" source/cadcraft/Cargo.toml || true
          grep -n 'name = "harfrust"' -A1 source/cadcraft/Cargo.lock || true
          git -C source/cadcraft status --short

      - name: Build the APK
        # The builder fetches its own Android SDK and NDK, so the runner's are not used.
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK NDK_HOME
          # Jangan turunkan versi crate demi MSRV (harfrust 0.14 -> 0.13.3 merusak cadcraft-fonts)
          export CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=allow
          bash build.sh -cadcraft

      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-ribbon-apk
          path: output/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
